# pre-commit runs these checks on every `git commit` (and in CI on every push).
# Install once per clone:  .venv\Scripts\pre-commit install
# Run on everything:        .venv\Scripts\pre-commit run --all-files
#
# Each `rev` is pinned to a full commit SHA (the tag is in the comment). A tag can be
# moved by whoever controls the upstream repo; a SHA cannot. Dependabot proposes updates.
repos:
  # General file hygiene + a second private-key check behind .gitignore
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # Python lint + format
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # frozen: v0.17.2
    hooks:
      - id: ruff-check
      - id: ruff-format

  # YAML lint (Sentinel rules, scenarios, workflows)
  - repo: https://github.com/adrienverge/yamllint
    rev: cba56bcde1fdd01c1deb3f945e69764c291a6530  # frozen: v1.38.0
    hooks:
      - id: yamllint

  # Secret scan of the staged changes. CI also scans the full git history separately.
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
